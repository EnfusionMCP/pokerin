services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_USER: pokerin
      POSTGRES_PASSWORD: pokerin
      POSTGRES_DB: pokerin
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokerin"]
      interval: 5s
      timeout: 3s
      retries: 5
volumes:
  pgdata_dev:
