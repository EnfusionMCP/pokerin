version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-runtime:
        dependency-type: production
      python-development:
        dependency-type: development
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-runtime:
        dependency-type: production
      frontend-development:
        dependency-type: development
  - package-ecosystem: gomod
    directory: /deploy/caddy-build
    schedule:
      interval: weekly
    groups:
      caddy-runtime:
        dependency-type: production
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
