[project]
name = "pokerin"
version = "0.1.0"
description = "EVE Online ISK poker platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30",
    "websockets>=13.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "aiosqlite>=0.22",
    "aiohttp>=3.12",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.28",
    "phevaluator>=0.5",
    "passlib>=1.7",
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pip-audit>=2.9",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires an explicitly authorized disposable PostgreSQL database",
]

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"
